spring:
  application.name: rosalina-social-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rosalina}
    username: ${DATABASE_USERNAME:rosalina}
    password: ${DATABASE_PASSWORD:rosalina}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
  jackson.default-property-inclusion: non_null
server:
  error.include-message: never
  forward-headers-strategy: framework
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-base64-encoded-key-with-at-least-32-bytes}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
springdoc.swagger-ui.path: /swagger-ui
