services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rosalina
      POSTGRES_USER: rosalina
      POSTGRES_PASSWORD: rosalina
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  api:
    build: .
    depends_on: [postgres]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/rosalina
      DATABASE_USERNAME: rosalina
      DATABASE_PASSWORD: rosalina
      SPRING_PROFILES_ACTIVE: local
    ports: ["127.0.0.1:8080:8080"]
volumes:
  postgres_data:
